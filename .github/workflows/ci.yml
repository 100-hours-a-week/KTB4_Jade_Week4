name: 백엔드 CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

jobs:
  test:
    name: 백엔드 빌드 및 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 테스트 실행
        run: ./gradlew test --no-daemon
