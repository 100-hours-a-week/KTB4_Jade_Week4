name: Backend CD

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 롤백하거나 재배포할 기존 이미지 태그
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  DOCKER_IMAGE: jeongminju45/banteum-backend
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Determine image tag
        id: image
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up JDK 21
        if: github.event_name == 'push'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        if: github.event_name == 'push'
        run: ./gradlew test --no-daemon

      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend through SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy backend $IMAGE_TAG" \
            --parameters commands="[
              \"set -e\",
              \"cd /home/ubuntu/deploy\",
              \"sed -i 's/^BACKEND_TAG=.*/BACKEND_TAG=${IMAGE_TAG}/' .env\",
              \"docker compose pull app\",
              \"docker compose up -d app\",
              \"docker compose ps app\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      - name: Health check
        shell: bash
        run: |
          for attempt in {1..12}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              https://banteum.click/api/auth/csrf || true)

            if [[ "$STATUS" == "204" ]]; then
              echo "Backend deployment succeeded"
              exit 0
            fi

            echo "Health check attempt $attempt returned $STATUS"
            sleep 6
          done

          echo "Backend health check failed"
          exit 1
