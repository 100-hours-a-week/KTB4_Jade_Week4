name: 백엔드 CD

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  DOCKER_IMAGE: jeongminju45/banteum-backend
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: 백엔드 빌드 및 배포
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: image
        shell: bash
        run: |
          TAG="sha-${GITHUB_SHA::7}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      # 테스트는 CI에서만 실행한다. master는 브랜치 보호로 CI 통과한 코드만
      # merge되므로 여기서 다시 실행하지 않는다.

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: AWS 임시 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSM으로 백엔드 배포
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy backend $IMAGE_TAG" \
            --parameters commands="[
              \"set -e\",
              \"exec 9>/var/lock/banteum-deploy.lock\",
              \"flock -w 300 9\",
              \"cd /home/ubuntu/deploy\",
              \"docker compose config app | grep -q healthcheck\",
              \"grep -q '^BACKEND_TAG=' .env\",
              \"cp .env .env.bak\",
              \"sed -i 's/^BACKEND_TAG=.*/BACKEND_TAG=${IMAGE_TAG}/' .env\",
              \"docker compose pull app\",
              \"docker compose up -d --wait --wait-timeout 120 app\",
              \"docker compose restart nginx\",
              \"docker compose ps app nginx\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          # aws ssm wait 의 기본 대기는 5초 x 20회 = 100초다. 잠금 대기 300초와
          # --wait-timeout 120초를 합치면 넘길 수 있어 직접 폴링한다.
          DEADLINE=$((SECONDS + 600))
          STATUS=Pending

          while (( SECONDS < DEADLINE )); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM command finished with status: $STATUS"
            exit 1
          fi

      - name: 외부 헬스체크
        shell: bash
        run: |
          for attempt in {1..12}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              https://banteum.click/api/auth/csrf || true)

            if [[ "$STATUS" == "204" ]]; then
              echo "Backend deployment succeeded"
              exit 0
            fi

            echo "Health check attempt $attempt returned $STATUS"
            sleep 6
          done

          echo "Backend health check failed"
          exit 1

      - name: 배포 실패 안내
        if: failure()
        env:
          NEW_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          echo "Backend deployment failed"
          echo "New image tag: ${NEW_TAG:-unknown}"
          echo ""
          echo "이 시점에 .env는 새 태그, 컨테이너는 이전 이미지일 수 있다."
          echo "배포 직전 .env는 /home/ubuntu/deploy/.env.bak 에 백업되어 있다."
          echo ""
          echo "EC2에서 직접 롤백:"
          echo "  cd /home/ubuntu/deploy"
          echo "  cat .env.bak            # 되돌아갈 태그 확인"
          echo "  cp .env.bak .env"
          echo "  docker compose pull app"
          echo "  docker compose up -d app"
          echo "  docker compose restart nginx"
          echo "  docker compose ps app nginx"
