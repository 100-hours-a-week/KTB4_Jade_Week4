services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
      - frontend
    restart: unless-stopped

  # 인증서 발급·갱신 전용. 12시간마다 깨어나 만료가 가까우면 갱신한다.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

  frontend:
    image: jeongminju45/banteum-frontend:${FRONTEND_TAG}
    expose:
      - "80"
    restart: unless-stopped

  app:
    image: jeongminju45/banteum-backend:${BACKEND_TAG}
    expose:
      - "8080"
    # 비밀값은 app.env 에 둔다. .env 에는 태그만 남겨 프론트도 안전하게 수정할 수 있게 한다.
    env_file: app.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    # 배포 게이트용. compose up --wait 가 이 결과를 보고 부팅 완료를 판단한다.
    # 부팅 중에는 start_interval 로 짧게 확인하고, 이후에는 30초 간격으로 낮춘다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/auth/csrf || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    expose:
      - "3306"
    env_file: mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 는 compose 치환을 막아 컨테이너 안의 환경변수를 그대로 쓰게 한다.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
  certbot-conf:
  certbot-www:
