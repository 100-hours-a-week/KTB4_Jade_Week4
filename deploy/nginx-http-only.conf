# Let's Encrypt 인증서를 최초 발급할 때만 사용하는 설정.
# 인증서 발급 후에는 nginx.conf로 교체한다.

server {
    listen 80;
    server_name banteum.click;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 200 "HTTPS certificate setup in progress.\n";
    }
}
