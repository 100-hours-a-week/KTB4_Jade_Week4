# 인증서 발급 완료 후 사용하는 설정.

server {
    listen 80;
    server_name banteum.click;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name banteum.click;

    ssl_certificate     /etc/letsencrypt/live/banteum.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/banteum.click/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 2m;

    # 워밍업 등 내부 전용 엔드포인트. 배포 스크립트가 컨테이너 안에서 직접 호출하므로
    # 외부에서 들어올 이유가 없다. 앱도 시크릿이 틀리면 404를 주지만 여기서 먼저 끊는다.
    location /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend_active;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass http://frontend_active;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
