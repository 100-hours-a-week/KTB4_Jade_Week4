spring:
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:banteum}
    username: ${DATABASE_USER:banteum}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 1000

logging:
  level:
    org:
      springframework:
        web: debug
      hibernate:
        SQL: off
#    org.springframework.orm.jpa: DEBUG
#    org.springframework.transaction.interceptor: TRACE
#    org.hibernate.orm.jdbc.bind: TRACE

security:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:15m}

  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:7d}

  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:ktb-banteum-dev}
    region: ${AWS_S3_REGION:ap-northeast-2}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:https://d28cyp412uo4kv.cloudfront.net}
    presigned-expiration: ${AWS_S3_PRESIGNED_EXPIRATION:5m}
